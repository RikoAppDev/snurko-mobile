name: iOS

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  framework:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - run: ./gradlew :composeApp:compileKotlinIosSimulatorArm64
      - run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64
      - run: ./gradlew :composeApp:linkDebugFrameworkIosArm64
      - run: xcodebuild -list -project iosApp/iosApp.xcodeproj
